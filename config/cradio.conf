# ─────────────────────────────────────────
# Bluetooth
# ─────────────────────────────────────────
CONFIG_BT_DEVICE_NAME_MAX=32
CONFIG_ZMK_KEYBOARD_NAME="Oguz Tastatur Mark II"

CONFIG_ZMK_BLE=y
CONFIG_BT_CTLR_TX_PWR_MINUS_8=y

# Akkustand der rechten Hälfte ebenfalls an den Host melden
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y

# Batterie (Messintervall in Sekunden: 30 Minuten)
CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_BATTERY_REPORT_INTERVAL=1800

# Deep Sleep nach 15 Minuten
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000

# USB aktivieren
CONFIG_ZMK_USB=y
